name: Laravel CI/CD Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: testing
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, bcmath, zip, pdo_mysql, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run MySQL migrations and tests
        env:
          APP_ENV: testing
          APP_DEBUG: false
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php artisan migrate:fresh --force
          php artisan test --compact

  deploy:
    name: Deploy to VPS
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Check out deployed commit
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, bcmath, zip, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Build production assets
        run: |
          npm ci
          npm run build

      - name: Create deployment package
        run: |
          PACKAGE="/tmp/lany-ticket-${GITHUB_SHA}.tar.gz"
          tar \
            --exclude='./.git' \
            --exclude='./.env' \
            --exclude='./node_modules' \
            --exclude='./storage' \
            -czf "$PACKAGE" .
          test -s "$PACKAGE"

      - name: Configure SSH
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_DEPLOY_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_DEPLOY_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Upload deployment package
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER || 'deploy' }}
        run: |
          test -n "$VPS_HOST"
          scp \
            -i "$HOME/.ssh/deploy_key" \
            -P "$VPS_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "/tmp/lany-ticket-${{ github.sha }}.tar.gz" \
            "$VPS_SSH_USER@$VPS_HOST:/tmp/lany-ticket-${{ github.sha }}.tar.gz"

      - name: Extract and activate deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER || 'deploy' }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_DEPLOY_PATH"
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_SSH_USER@$VPS_HOST" \
            "VPS_DEPLOY_PATH='$VPS_DEPLOY_PATH' GITHUB_SHA='$GITHUB_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail

          VPS_DEPLOY_PATH="${VPS_DEPLOY_PATH/#\~/$HOME}"
          ARCHIVE="/tmp/lany-ticket-${GITHUB_SHA}.tar.gz"

          test -d "$VPS_DEPLOY_PATH"
          test -f "$VPS_DEPLOY_PATH/.env"
          mkdir -p "$VPS_DEPLOY_PATH/storage"
          tar -xzf "$ARCHIVE" -C "$VPS_DEPLOY_PATH"
          rm -f "$ARCHIVE"
          cd "$VPS_DEPLOY_PATH"
          php artisan migrate --force
          php artisan optimize
          REMOTE
